name: Nightly UI Tests

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run tests
        run: mvn clean test
        continue-on-error: true

      - name: Install Allure CLI
        run: |
          curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxvf allure.tgz
          echo "$PWD/allure-2.29.0/bin" >> $GITHUB_PATH

      - name: Generate single-file Allure report
        run: allure generate --single-file target/allure-results -o target/allure-single-report --clean

      - name: Upload single-file Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-single-file-report
          path: target/allure-single-report/index.html